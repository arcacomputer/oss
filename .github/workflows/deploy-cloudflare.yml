name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e320a5a80611f9a30148d452929b1fb1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm audit --audit-level=low
      - name: Verify production account
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}`, {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
          });
          const body = await response.json();
          if (!response.ok || !body.success || body.result.id !== 'e320a5a80611f9a30148d452929b1fb1') {
            throw new Error('Company account identity verification failed');
          }
          console.log('Verified production Cloudflare account:', body.result.id);
          NODE
      - name: Upload exact Worker version
        run: npx wrangler versions upload --config wrangler.json --tag "$GITHUB_SHA" --message "GitHub $GITHUB_SHA"
      - name: Deploy exact Worker version
        run: npx wrangler versions deploy --config wrangler.json --version-tag "$GITHUB_SHA" --percentage 100 --yes --message "GitHub $GITHUB_SHA"
