name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm audit --audit-level=low
      - name: Upload exact Worker version
        run: npx wrangler versions upload --config wrangler.json --tag "$GITHUB_SHA" --message "GitHub $GITHUB_SHA"
      - name: Deploy exact Worker version
        run: npx wrangler versions deploy --config wrangler.json --version-tag "$GITHUB_SHA" --percentage 100 --yes --message "GitHub $GITHUB_SHA"
