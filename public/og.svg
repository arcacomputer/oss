    <text x="64" y="88" font-size="36" letter-spacing="-1">Arca Computer, Inc.</text>
    <line x1="64" y1="126" x2="1136" y2="126" stroke="#35404b" stroke-width="2"/>
    <g font-size="99" letter-spacing="-5">
